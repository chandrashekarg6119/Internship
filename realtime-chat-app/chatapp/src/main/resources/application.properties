# =============================================
# APPLICATION CONFIGURATION
# =============================================
spring.application.name=realtime-chat
server.port=8080

# =============================================
# DATABASE CONFIGURATION (MySQL)
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/chatapp_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Gcs@191204
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# =============================================
# REDIS CONFIGURATION
# =============================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
# spring.data.redis.password=yourpassword  # Uncomment if Redis has a password

# =============================================
# JWT CONFIGURATION
# =============================================
app.jwt.secret=ThisIsAVeryLongSecretKeyForJWTTokenGenerationThatShouldBeAtLeast256BitsLong!@#$
app.jwt.expiration=86400000
# 86400000 ms = 24 hours

# =============================================
# FILE UPLOAD
# =============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/

# =============================================
# LOGGING
# =============================================
logging.level.com.chatapp=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.socket=DEBUG
